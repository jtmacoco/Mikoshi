<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>swapPairs Animation</title>
<style>
  :root {
    --bg: #1e1e2a;
    --panel: #262635;
    --node: #3a3a52;
    --node-border: #5a5a78;
    --accent-cur: #f4a261;
    --accent-prev: #2a9d8f;
    --accent-snd: #e76f51;
    --accent-tmp: #a78bfa;
    --accent-dummy: #6b7280;
    --text: #e5e5f0;
    --muted: #9a9ab0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .wrap {
    max-width: 820px;
    margin: 0 auto;
    background: var(--panel);
    border-radius: 14px;
    padding: 20px 24px 24px;
  }
  h2 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 600;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 16px;
  }
  svg { width: 100%; height: 220px; display: block; }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  button {
    background: var(--node);
    border: 1px solid var(--node-border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
  }
  button:hover { background: #454564; }
  button:disabled { opacity: 0.4; cursor: default; }
  .step-label {
    flex: 1;
    min-width: 220px;
    font-size: 13px;
    color: var(--muted);
  }
  .code-line {
    background: #14141d;
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 14px;
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 13px;
    color: #d4d4e0;
    min-height: 20px;
  }
  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <h2>swapPairs() — pointer walkthrough</h2>
  <div class="subtitle">List: 1 → 2 → 3 → 4</div>
  <svg id="svg" viewBox="0 0 780 220"></svg>
  <div class="code-line" id="codeLine">Click "Start" to begin</div>
  <div class="controls">
    <button id="prevBtn">◀ Back</button>
    <button id="nextBtn">Next ▶</button>
    <button id="resetBtn">Reset</button>
    <div class="step-label" id="stepLabel">Step 0 / 0</div>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:var(--accent-dummy)"></i>dummy</span>
    <span><i class="dot" style="background:var(--accent-prev)"></i>prev</span>
    <span><i class="dot" style="background:var(--accent-cur)"></i>cur</span>
    <span><i class="dot" style="background:var(--accent-snd)"></i>snd (cur.next)</span>
    <span><i class="dot" style="background:var(--accent-tmp)"></i>tmp</span>
  </div>
</div>

<script>
const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';

// Node layout: dummy, 1, 2, 3, 4  -> positions will be reassigned per step
const values = ['dummy', '1', '2', '3', '4'];
const baseX = { dummy: 60, '1': 200, '2': 340, '3': 480, '4': 620 };
const y = 110;

// Steps encode: node order (visual positions), pointer states, arrows (list order), code line, label
const steps = [
  {
    order: ['dummy','1','2','3','4'],
    pointers: { dummy: 'dummy' },
    arrows: [['dummy','1'],['1','2'],['2','3'],['3','4']],
    code: 'cur = head; prev = dummy = ListNode(next=cur)',
    label: 'Step 1 / 9 — initial state'
  },
  {
    order: ['dummy','1','2','3','4'],
    pointers: { dummy: 'dummy', prev: 'dummy', cur: '1' },
    arrows: [['dummy','1'],['1','2'],['2','3'],['3','4']],
    code: 'while cur and cur.next:  →  cur=1, cur.next=2 ✓ enter loop',
    label: 'Step 2 / 9 — loop starts, cur = 1'
  },
  {
    order: ['dummy','1','2','3','4'],
    pointers: { dummy: 'dummy', prev: 'dummy', cur: '1', snd: '2', tmp: '3' },
    arrows: [['dummy','1'],['1','2'],['2','3'],['3','4']],
    code: 'tmp = cur.next.next  (=3);  snd = cur.next  (=2)',
    label: 'Step 3 / 9 — save snd=2 and tmp=3'
  },
  {
    order: ['dummy','1','2','3','4'],
    pointers: { dummy: 'dummy', prev: 'dummy', cur: '1', snd: '2', tmp: '3' },
    arrows: [['dummy','1'],['2','1'],['2','3'],['3','4']],
    code: 'snd.next = cur   →   2 now points to 1',
    label: 'Step 4 / 9 — snd.next = cur'
  },
  {
    order: ['dummy','1','2','3','4'],
    pointers: { dummy: 'dummy', prev: 'dummy', cur: '1', snd: '2', tmp: '3' },
    arrows: [['dummy','1'],['2','1'],['1','3'],['3','4']],
    code: 'cur.next = tmp   →   1 now points to 3',
    label: 'Step 5 / 9 — cur.next = tmp'
  },
  {
    order: ['dummy','2','1','3','4'],
    pointers: { dummy: 'dummy', prev: 'dummy', cur: '1', snd: '2', tmp: '3' },
    arrows: [['dummy','2'],['2','1'],['1','3'],['3','4']],
    code: 'prev.next = snd   →   dummy now points to 2 (pair linked in!)',
    label: 'Step 6 / 9 — prev.next = snd, pair 1↔2 fully wired'
  },
  {
    order: ['dummy','2','1','3','4'],
    pointers: { dummy: 'dummy', prev: '1', cur: '3' },
    arrows: [['dummy','2'],['2','1'],['1','3'],['3','4']],
    code: 'prev = cur (=1);  cur = tmp (=3)   →   advance for next pair',
    label: 'Step 7 / 9 — prev=1, cur=3, next loop iteration'
  },
  {
    order: ['dummy','2','1','3','4'],
    pointers: { dummy: 'dummy', prev: '1', cur: '3', snd: '4', tmp: null },
    arrows: [['dummy','2'],['2','1'],['1','4'],['4','3']],
    code: 'Repeat: tmp=null, snd=4 → snd.next=cur, cur.next=tmp, prev.next=snd',
    label: 'Step 8 / 9 — pair 3↔4 swapped the same way'
  },
  {
    order: ['dummy','2','1','4','3'],
    pointers: { dummy: 'dummy' },
    arrows: [['dummy','2'],['2','1'],['1','4'],['4','3']],
    code: 'cur = tmp = null → loop ends. return dummy.next',
    label: 'Step 9 / 9 — done: 2 → 1 → 4 → 3'
  }
];

let stepIdx = 0;

function nodeColor(name, pointers) {
  if (pointers.cur === name) return getVar('--accent-cur');
  if (pointers.prev === name) return getVar('--accent-prev');
  if (pointers.snd === name) return getVar('--accent-snd');
  if (pointers.dummy === name) return getVar('--accent-dummy');
  return getVar('--node');
}
function getVar(v) {
  return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
}

function labelsFor(name, pointers) {
  const labels = [];
  for (const [k, val] of Object.entries(pointers)) {
    if (val === name) labels.push(k);
  }
  return labels;
}

function render() {
  const step = steps[stepIdx];
  svg.innerHTML = '';

  // position map based on order
  const pos = {};
  step.order.forEach((name, i) => {
    pos[name] = 60 + i * 160;
  });

  // draw arrows first (so nodes sit on top)
  step.arrows.forEach(([from, to]) => {
    if (!(from in pos) || !(to in pos)) return;
    const x1 = pos[from] + 30, x2 = pos[to] - 30;
    const path = document.createElementNS(NS, 'path');
    const midY = y - 55;
    const curved = Math.abs(pos[to] - pos[from]) > 170;
    const d = curved
      ? `M ${x1} ${y-15} C ${x1+40} ${midY}, ${x2-40} ${midY}, ${x2} ${y-15}`
      : `M ${x1} ${y} L ${x2} ${y}`;
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#8a8aa8');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('marker-end', 'url(#arrow)');
    svg.appendChild(path);
  });

  // arrow marker def
  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = `<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#8a8aa8" />
  </marker>`;
  svg.appendChild(defs);

  // draw nodes
  step.order.forEach(name => {
    const cx = pos[name];
    const g = document.createElementNS(NS, 'g');
    const isDummy = name === 'dummy';
    const r = isDummy ? 22 : 26;

    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('cx', cx);
    circle.setAttribute('cy', y);
    circle.setAttribute('r', r);
    circle.setAttribute('fill', nodeColor(name, step.pointers));
    circle.setAttribute('stroke', '#e5e5f0');
    circle.setAttribute('stroke-width', name === 'dummy' ? 1 : 1.5);
    circle.setAttribute('opacity', name === 'dummy' ? 0.85 : 1);
    g.appendChild(circle);

    const text = document.createElementNS(NS, 'text');
    text.setAttribute('x', cx);
    text.setAttribute('y', y + 5);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', '#fff');
    text.setAttribute('font-size', isDummy ? '10' : '15');
    text.setAttribute('font-family', 'monospace');
    text.textContent = isDummy ? 'Ø' : name;
    g.appendChild(text);

    // pointer labels above
    const labels = labelsFor(name, step.pointers);
    labels.forEach((lab, i) => {
      const lt = document.createElementNS(NS, 'text');
      lt.setAttribute('x', cx);
      lt.setAttribute('y', y - 40 - i * 16);
      lt.setAttribute('text-anchor', 'middle');
      lt.setAttribute('font-size', '11');
      lt.setAttribute('font-family', 'monospace');
      lt.setAttribute('fill', nodeColor(name, step.pointers));
      lt.setAttribute('font-weight', '600');
      lt.textContent = lab;
      g.appendChild(lt);
    });

    svg.appendChild(g);
  });

  document.getElementById('codeLine').textContent = step.code;
  document.getElementById('stepLabel').textContent = step.label;
  document.getElementById('prevBtn').disabled = stepIdx === 0;
  document.getElementById('nextBtn').disabled = stepIdx === steps.length - 1;
}

document.getElementById('nextBtn').onclick = () => {
  if (stepIdx < steps.length - 1) { stepIdx++; render(); }
};
document.getElementById('prevBtn').onclick = () => {
  if (stepIdx > 0) { stepIdx--; render(); }
};
document.getElementById('resetBtn').onclick = () => {
  stepIdx = 0; render();
};

render();
</script>
</body>
</html>
